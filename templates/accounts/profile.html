{% extends "dashboard/base.html" %}

{% block title %}
Profile | AI Blog CMS
{% endblock %}

{% block content %}

<section class="py-5 bg-light">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="card border-0 shadow-sm">

                    <div class="card-body p-5">

                        <div class="text-center mb-4">

                            <i
                                class="bi bi-person-circle display-3 text-primary"
                            ></i>

                            <h1 class="h3 fw-bold mt-3">
                                {{ user.username }}
                            </h1>

                        </div>


                        <form method="post">

                            {% csrf_token %}

                            {{ form.as_p }}

                            <button
                                class="btn btn-primary w-100"
                            >
                                Save Profile
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
