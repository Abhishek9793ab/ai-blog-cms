{% extends "dashboard/base.html" %}

{% block title %}
Tags | AI Blog CMS
{% endblock %}

{% block content %}

<section class="py-5 bg-light">

<div class="container">

<div class="row g-4">

<div class="col-lg-4">

<div class="card border-0 shadow-sm">

<div class="card-body p-4">

<h1 class="h4 fw-bold">
Add Tag
</h1>

<form method="post" class="mt-3">

{% csrf_token %}

{{ form.as_p }}

<button class="btn btn-primary w-100">
Add Tag
</button>

</form>

</div>

</div>

</div>


<div class="col-lg-8">

<div class="card border-0 shadow-sm">

<div class="card-body">

<h2 class="h4 fw-bold mb-4">
All Tags
</h2>

<div class="d-flex flex-wrap gap-2">

{% for tag in tags %}

<div class="badge text-bg-light border p-2">

{{ tag.name }}

<form
method="post"
action="{% url 'dashboard:tag_delete' tag.pk %}"
class="d-inline"
onsubmit="return confirm('Delete tag?');"
>

{% csrf_token %}

<button
class="btn btn-sm text-danger p-0 ms-2"
type="submit"
>
×
</button>

</form>

</div>

{% empty %}

<p class="text-muted">
No tags yet.
</p>

{% endfor %}

</div>

</div>

</div>

</div>

</div>

</section>

{% endblock %}
