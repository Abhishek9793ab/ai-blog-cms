{% extends "dashboard/base.html" %}

{% block title %}
Login | AI Blog CMS
{% endblock %}

{% block content %}

<section class="py-5 bg-light">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="card border-0 shadow-sm">

                    <div class="card-body p-5">

                        <div class="text-center mb-4">

                            <i
                                class="bi bi-stars display-5 text-primary"
                            ></i>

                            <h1 class="h3 fw-bold mt-3">
                                Welcome Back
                            </h1>

                            <p class="text-muted">
                                Login to your AI Blog CMS account.
                            </p>

                        </div>


                        <form method="post">

                            {% csrf_token %}

                            {{ form.as_p }}

                            {% if next %}
                                <input
                                    type="hidden"
                                    name="next"
                                    value="{{ next }}"
                                >
                            {% endif %}

                            <button
                                class="btn btn-primary w-100 btn-lg"
                            >
                                Login
                            </button>

                        </form>


                        <p class="text-center mt-4 mb-0">

                            Don't have an account?

                            <a
                                href="{% url 'accounts:register' %}"
                            >
                                Register
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
